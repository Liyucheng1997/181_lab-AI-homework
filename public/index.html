<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作业帮 · AI 智能批改</title>
  <link rel="stylesheet" href="style.css" />
  <!-- 纯网页版在浏览器里加载 Claude SDK（构建时打包到 vendor/，见 scripts/build-pages.mjs） -->
  <script type="importmap">{ "imports": { "@anthropic-ai/sdk": "./vendor/anthropic-sdk.js" } }</script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✍️</text></svg>" />
</head>
<body>
  <div class="app">
    <!-- 侧边导航 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">作</div>
        <div>
          <div class="brand-name">作业帮</div>
          <div class="brand-sub">AI 智能批改</div>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="classes">
          <svg class="nav-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>班级管理</span>
        </button>
        <button class="nav-item" data-view="assignments">
          <svg class="nav-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h4"/></svg><span>作业与答案</span>
        </button>
        <button class="nav-item" data-view="grading">
          <svg class="nav-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span>智能批改</span>
        </button>
        <button class="nav-item" data-view="analysis">
          <svg class="nav-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg><span>成绩分析</span>
        </button>
      </nav>
      <div class="sidebar-foot">
        <button id="aiStatus" class="ai-status" title="AI 设置"><span class="status-dot"></span><span class="ai-status-text"><b>检测中…</b></span></button>
        <button id="btnTheme" class="icon-btn" title="切换深色模式"></button>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main">
      <!-- 班级管理 -->
      <section id="view-classes" class="view active">
        <header class="view-head">
          <div>
            <h1>班级管理</h1>
            <p class="muted">先录入班级和学生名单，之后上传的作业会自动关联到学生</p>
          </div>
          <button class="btn primary" id="btnAddClass">＋ 新建班级</button>
        </header>
        <div id="classList" class="class-grid"></div>
      </section>

      <!-- 作业与答案 -->
      <section id="view-assignments" class="view">
        <header class="view-head">
          <div>
            <h1>作业与答案</h1>
            <p class="muted">为每次作业录入标准答案与分值，AI 将据此批改</p>
          </div>
          <button class="btn primary" id="btnAddAsg">＋ 新建作业</button>
        </header>
        <div id="asgList" class="asg-list"></div>
      </section>

      <!-- 智能批改 -->
      <section id="view-grading" class="view">
        <header class="view-head">
          <div>
            <h1>智能批改</h1>
            <p class="muted">上传作业照片 → AI 识别并对照标准答案 → 生成红笔批注与成绩</p>
          </div>
          <select id="gradeAsgSelect" class="select wide"></select>
        </header>
        <div id="gradeBody"></div>
      </section>

      <!-- 成绩分析 -->
      <section id="view-analysis" class="view">
        <header class="view-head">
          <div>
            <h1>成绩分析</h1>
            <p class="muted">班级成绩单 · 学生成绩走势 · 逐题错误率</p>
          </div>
          <div class="tabbar" id="analysisTabs">
            <button class="tab active" data-tab="sheet">成绩单</button>
            <button class="tab" data-tab="student">学生分析</button>
            <button class="tab" data-tab="question">试卷讲评</button>
          </div>
        </header>
        <div id="analysisBody"></div>
      </section>
    </main>
  </div>

  <!-- 批改详情（全屏） -->
  <div id="reviewOverlay" class="overlay hidden">
    <div class="review">
      <header class="review-head">
        <button class="btn ghost" id="btnCloseReview">‹ 返回</button>
        <div class="review-title" id="reviewTitle"></div>
        <div class="review-actions">
          <button class="btn" id="btnExportPng">导出批改图</button>
          <button class="btn primary" id="btnSaveReview">保存修改</button>
        </div>
      </header>
      <div class="review-body">
        <div class="review-canvas-wrap" id="reviewCanvasWrap">
          <div class="review-canvas" id="reviewCanvas">
            <img id="reviewImg" alt="作业图片" draggable="false" />
            <svg id="marksSvg"></svg>
          </div>
          <p class="hint">提示：红笔标记可直接拖动微调位置</p>
        </div>
        <aside class="review-panel" id="reviewPanel"></aside>
      </div>
    </div>
  </div>

  <!-- 通用弹窗 -->
  <div id="modal" class="overlay hidden">
    <div class="modal" id="modalBox"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="vendor/chart.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
